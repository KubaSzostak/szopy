[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "szo"
dynamic = ["version"] # src/szo/__init__.py
description = "Reusable building blocks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kuba Szostak" }]
dependencies = [
    "psycopg>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/kubaszostak/szopy"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/szo/__init__.py"
